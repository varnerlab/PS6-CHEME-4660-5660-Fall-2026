# Graded settings: do not edit. Every graded run reads this file.

# Number of trading days in one year. A growth rate is the daily log return divided by one trading day, 1/252 of a year.
steps_per_year = 252

# Number of hidden states in each jump hidden Markov model.
number_of_states = 100

# Degrees of freedom of the Student-t distribution of each hidden state.
nu = 5.0

# Probability that a jump episode starts on a given day. The value comes from the tuned SPY model of L13a.
epsilon = 1.0e-4

# Mean length of a jump episode, in trading days. The value comes from the tuned SPY model of L13a.
lambda = 100.0

# Number of synthetic markets behind each synthetic row of the report. Each synthetic market is as long as the data.
number_of_paths = 10

# Seed of the random numbers, so that every run draws the same synthetic markets.
seed = 5660

# The market: SPY, the exchange-traded fund that tracks the S&P 500.
benchmark_ticker = "SPY"

# FRED series used as economic factors on the Advanced track: column names in data/fred-levels-2014-2024.csv.
fred_series = ["DGS10", "T10YIE", "DCOILBRENTEU", "DTWEXBGS"]

# How each FRED series becomes a daily factor: "change" for a rate (the daily change), "growth" for a price or an index (the growth rate).
fred_kinds = ["change", "change", "growth", "growth"]

# The name of each FRED series in the report.
fred_names = ["10-year Treasury yield", "10-year breakeven inflation", "Brent oil price", "US dollar index"]

# Pairs of sectors in the report: the first sector of each pair, then the second sector of each pair.
pair_first = ["Real Estate", "Consumer Staples", "Energy"]
pair_second = ["Utilities", "Information Technology", "Information Technology"]
